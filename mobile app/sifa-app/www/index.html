<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b2115" />
  <meta name="description" content="SIFA Consulting صفة للاستشارات - Professional advisory services" />
  <title>SIFA Consulting</title>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/android-chrome-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/images/android-chrome-512x512.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <!-- Scroll progress -->
    <div id="scrollbar"></div>

    <!-- Top header -->
    <header id="header">
      <a class="brand" data-nav="/home">
        <img src="assets/images/main_logo-BcvzCDPm.png" alt="SIFA Consulting" />
      </a>
      <div class="header-actions">
        <button id="langBtn" class="lang-btn" aria-label="Toggle language">عربي</button>
        <button id="menuBtn" class="menu-btn" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <!-- Full screen menu overlay -->
    <nav id="menu" class="menu-overlay" aria-hidden="true">
      <div class="menu-inner">
        <a class="menu-link" data-nav="/home"><span class="menu-num">01</span> <span class="menu-text" data-i18n="nav.home">Home</span></a>
        <a class="menu-link" data-nav="/about"><span class="menu-num">02</span> <span class="menu-text" data-i18n="nav.about">About</span></a>
        <a class="menu-link" data-nav="/services"><span class="menu-num">03</span> <span class="menu-text" data-i18n="nav.services">Services</span></a>
        <a class="menu-link" data-nav="/insights"><span class="menu-num">04</span> <span class="menu-text" data-i18n="nav.insight">Insights</span></a>
        <a class="menu-link" data-nav="/contact"><span class="menu-num">05</span> <span class="menu-text" data-i18n="nav.contacts">Contact</span></a>
        <a class="menu-link" data-nav="/pricing"><span class="menu-num">06</span> <span class="menu-text" data-i18n="nav.pricing">Pricing</span></a>
        <div class="menu-contact">
          <a href="mailto:info@sifa.consulting">info@sifa.consulting</a>
          <a href="tel:+966112090039">+966 11 209 0039</a>
        </div>
      </div>
    </nav>

    <!-- App content -->
    <main id="view"></main>

    <!-- Bottom navigation -->
    <nav id="tabbar">
      <a data-nav="/home" class="tab"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h6v-5h2v5h6v-8h3z"/></svg><span data-i18n="nav.home">Home</span></a>
      <a data-nav="/services" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v4l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="nav.services">Services</span></a>
      <a data-nav="/insights" class="tab"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="nav.insight">Insights</span></a>
      <a data-nav="/about" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="nav.about">About</span></a>
      <a data-nav="/contact" class="tab"><svg viewBox="0 0 24 24"><path d="M4 6c0-1.1.9-2 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m4 7 8 5 8-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="nav.contacts">Contact</span></a>
    </nav>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Video modal -->
    <div id="videoModal" class="modal" aria-hidden="true">
      <button id="videoClose" class="modal-close" aria-label="Close">×</button>
      <div id="videoFrame" class="modal-content"></div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
